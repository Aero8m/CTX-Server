name: ctx-server-tests
services:
  mysql:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    environment:
      MYSQL_ROOT_PASSWORD: ctx-test-root-password
      MYSQL_DATABASE: ctx_test
      MYSQL_USER: ctx_test
      MYSQL_PASSWORD: ctx-test-password
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_bin]
    ports: ["127.0.0.1:33306:3306"]
    tmpfs: [/var/lib/mysql]
    volumes:
      - ./deploy/test-init.sql:/docker-entrypoint-initdb.d/ctx.sql:ro
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 30
